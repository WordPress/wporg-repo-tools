name: "Setup"
description: "Set up the environment"

inputs:
  token:
    description: "A GitHub token."
    required: true
    type: string
  packageManager:
    description: "Package manager to use"
    type: string
    required: false
    default: "yarn"
  skip-build:
    description: "Skip the build step"
    type: string
    required: false
    default: "false"


runs:
  using: "composite"
  steps:
    - name: Install svn
      shell: bash
      run: |
        sudo apt install subversion

    - name: Install NodeJS
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: ".nvmrc"
        cache: ${{ inputs.packageManager }}

    - name: Setup PHP with PECL extension
      uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
      with:
        php-version: "8.1"
      env:
        COMPOSER_TOKEN: ${{ inputs.token }}

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: composer-

    - name: Install all dependencies (yarn)
      shell: bash
      if: ${{ 'yarn' == inputs.packageManager }}
      run: |
        composer install || composer update wporg/*
        yarn
        yarn setup:tools

    - name: Build all included projects (yarn)
      shell: bash
      if: ${{ inputs.packageManager == 'yarn' && inputs.skip-build != 'true' }}
      run: yarn workspaces run build

    - name: Install all dependencies (npm)
      shell: bash
      if: ${{ 'npm' == inputs.packageManager }}
      run: |
        composer install || composer update wporg/*
        npm install
        npm run setup:tools

    - name: Build all included projects (npm)
      shell: bash
      if: ${{ inputs.packageManager == 'npm' && inputs.skip-build != 'true' }}
      run: npm run build --workspaces --if-present
