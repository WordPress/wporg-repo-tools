name: "Lint"
description: "Run all linters"

inputs:
  packageManager:
    description: "Package manager to use. One of 'yarn' or 'npm'."
    required: false
    default: "yarn"

runs:
  using: "composite"
  steps:
    # Every step below is selected by an `if:` on this value, so an unrecognised
    # one would skip all of them and report success without linting anything.
    - name: Validate the package manager
      shell: bash
      if: ${{ 'yarn' != inputs.packageManager && 'npm' != inputs.packageManager }}
      run: |
        echo "::error::packageManager must be 'yarn' or 'npm'."
        exit 1

    - name: Lint CSS (yarn)
      shell: bash
      if: ${{ 'yarn' == inputs.packageManager }}
      run: yarn workspaces run lint:css

    - name: Lint JS (yarn)
      shell: bash
      if: ${{ 'yarn' == inputs.packageManager }}
      run: yarn workspaces run lint:js

    # No --if-present: npm would then skip a workspace whose lint script is
    # missing or misnamed and still report success, where the yarn leg fails.
    # Both legs should mean the same thing.
    - name: Lint CSS (npm)
      shell: bash
      if: ${{ 'npm' == inputs.packageManager }}
      run: npm run lint:css --workspaces

    - name: Lint JS (npm)
      shell: bash
      if: ${{ 'npm' == inputs.packageManager }}
      run: npm run lint:js --workspaces

    # Selected with a condition rather than by interpolating the input into the
    # command, so the input never reaches a shell. Matches the setup action.
    - name: Lint PHP (yarn)
      shell: bash
      if: ${{ 'yarn' == inputs.packageManager }}
      run: yarn run lint:php

    - name: Lint PHP (npm)
      shell: bash
      if: ${{ 'npm' == inputs.packageManager }}
      run: npm run lint:php
