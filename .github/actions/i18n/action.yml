name: "i18n"
description: "Generate translation strings from content"

inputs:
  token:
    description: "A GitHub token."
    required: true
    type: string

  args:
    description: "CLI args passed through to i18n script."
    required: false
    type: string

  php-version:
    description: "PHP version to install on the runner."
    required: false
    type: string
    default: "8.4"

runs:
  using: "composite"
  steps:
    - name: Install svn (if needed by Composer)
      shell: bash
      run: |
        if grep -qE '"type"[[:space:]]*:[[:space:]]*"svn"|\.svn\.wordpress\.org' composer.json composer.lock 2>/dev/null; then
          sudo apt-get install -y --no-install-recommends subversion
        fi

    - name: Setup PHP with PECL extension
      uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
      with:
        php-version: ${{ inputs.php-version }}
      env:
        COMPOSER_TOKEN: ${{ inputs.token }}

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-${{ inputs.php-version }}-composer-${{ hashFiles('composer.lock', 'composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ inputs.php-version }}-composer-

    - name: Install composer dependencies
      shell: bash
      run: |
        composer install --no-interaction --prefer-dist || composer update --no-interaction --prefer-dist wporg/* || {
          echo "::error::Composer could not resolve dependencies. A conflict on wp-coding-standards/wpcs, squizlabs/php_codesniffer, phpcompatibility/phpcompatibility-wp or dealerdirect/phpcodesniffer-composer-installer means your own require-dev still pins one of them: remove it, wporg-repo-tools provides them now. A minimum-stability error means your root composer.json needs minimum-stability set to alpha and prefer-stable set to true. See https://github.com/WordPress/wporg-repo-tools#coding-standards"
          exit 1
        }

    - name: Run translation script
      shell: bash
      run: php ${{ github.action_path }}/bin/i18n.php ${{ inputs.args }}

    - name: Reset the composer files
      shell: bash
      run: |
        git checkout composer.json
        git checkout composer.lock || echo "No composer.lock"
