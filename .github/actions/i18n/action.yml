name: "i18n"
description: "Generate translation strings from content"

inputs:
  token:
    description: "A GitHub token."
    required: true
    type: string

  args:
    description: "CLI args passed through to i18n script."
    required: false
    type: string

runs:
  using: "composite"
  steps:
    - name: Install svn
      shell: bash
      run: |
        sudo apt install subversion

    - name: Setup PHP with PECL extension
      uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
      with:
        php-version: "8.4"
      env:
        # Use http-basic auth instead of COMPOSER_TOKEN to work around
        # https://github.com/composer/composer/issues/12849 — Composer's
        # GitHub token validator rejects `-` in JWT-format GITHUB_TOKEN values.
        COMPOSER_AUTH: '{"http-basic":{"github.com":{"username":"x-access-token","password":"${{ inputs.token }}"}}}'

    - name: Install composer dependencies
      shell: bash
      run: |
        composer install || composer update wporg/*

    - name: Run translation script
      shell: bash
      run: php ${{ github.action_path }}/bin/i18n.php ${{ inputs.args }}

    - name: Reset the composer files
      shell: bash
      run: |
        git checkout composer.json
        git checkout composer.lock || echo "No composer.lock"
