name: "i18n"
description: "Generate translation strings from content"

inputs:
  token:
    description: "A GitHub token."
    required: true
    type: string

  args:
    description: "CLI args passed through to i18n script."
    required: false
    type: string

  php-version:
    description: "PHP version to install on the runner."
    required: false
    type: string
    default: "8.4"

runs:
  using: "composite"
  steps:
    - name: Install svn
      shell: bash
      run: |
        sudo apt install subversion

    - name: Setup PHP with PECL extension
      uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
      with:
        php-version: ${{ inputs.php-version }}
      env:
        COMPOSER_TOKEN: ${{ inputs.token }}

    - name: Install composer dependencies
      shell: bash
      run: |
        composer install || composer update wporg/* || {
          echo "::error::Composer could not resolve dependencies. If the failure above mentions minimum-stability, your root composer.json needs minimum-stability set to alpha and prefer-stable set to true; wporg-repo-tools tracks the PHPCompatibility 3.0 alpha. See https://github.com/WordPress/wporg-repo-tools#coding-standards"
          exit 1
        }

    - name: Run translation script
      shell: bash
      run: php ${{ github.action_path }}/bin/i18n.php ${{ inputs.args }}

    - name: Reset the composer files
      shell: bash
      run: |
        git checkout composer.json
        git checkout composer.lock || echo "No composer.lock"
